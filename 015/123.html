  <body>
    <script>
      let obj1 = { name: "A" };

      // 2. 新增引用，计数 = 2
      let obj2 = obj1;

      // 3. 解除引用，计数 = 1
      obj1 = null;

      // 4. 再次解除，计数 = 0 → 回收

      console.log(obj2);
      console.log(obj1);
    </script>
  </body>
