<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>学生就业统计表</title>
    <link rel="stylesheet" href="./iconfont/iconfont.css" />
    <link rel="stylesheet" href="css/index.css" />
  </head>

  <body>
    <h1>学生就业统计表</h1>
    <form class="info" autocomplete="off">
      <input type="text" class="uname" name="uname" placeholder="姓名" />
      <input type="text" class="age" name="age" placeholder="年龄" />
      <input type="text" class="salary" name="salary" placeholder="薪资" />
      <select name="gender" class="gender">
        <option value="男">男</option>
        <option value="女">女</option>
      </select>
      <select name="city" class="city">
        <option value="北京">北京</option>
        <option value="上海">上海</option>
        <option value="广州">广州</option>
        <option value="深圳">深圳</option>
        <option value="曹县">曹县</option>
      </select>
      <button class="add"><i class="iconfont icon-tianjia"></i>添加</button>
    </form>

    <div class="title">共有数据<span>0</span>条</div>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>姓名</th>
          <th>年龄</th>
          <th>性别</th>
          <th>薪资</th>
          <th>就业城市</th>
          <th>录入时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <!-- <tr>
        <td>1</td>
        <td>迪丽热巴</td>
        <td>23</td>
        <td>女</td>
        <td>12000</td>
        <td>北京</td>
        <td>2099/9/9 08:08:08</td>
        <td>
          <a href="javascript:">
            <i class="iconfont icon-shanchu"></i>
            删除
          </a>
        </td>
      </tr> -->
      </tbody>
    </table>
    <script>
      // 参考数据
      const initData = [
        {
          stuId: 1,
          uname: "迪丽热巴",
          age: 22,
          salary: "12000",
          gender: "女",
          city: "北京",
          time: "2099/9/9 08:08:08",
        },
      ];
      const tbody = document.querySelector("tbody");
      // localStorage.setItem("data", JSON.stringify(initData));
      // 1. 渲染业务
      // 1.1 先读取本地存储的数据
      // (1). 本地存储有数据则记得转换为对象然后存储到变量里面，后期用于渲染页面
      // (2). 如果没有数据，则用 空数组来代替

      const arr = JSON.parse(localStorage.getItem("data")) || [];
      // 不要用反，取数据为getitem，把json变为对象用parse

      // 1.2 利用map和join方法来渲染页面
      // (1). 利用map遍历数组，返回对应tr的数组
      function render() {
        const trArr = arr.map(function (ele, index) {
          return `
          <tr>
        <td>${ele.stuId}</td>
        <td>${ele.uname}</td>
        <td>${ele.age}</td>
        <td>${ele.gender}</td>
        <td>${ele.salary}</td>
        <td>${ele.city}</td>
        <td>${ele.time}</td>
        <td>
          <a href="javascript:" data-id=${index}>
            <i class="iconfont icon-shanchu"></i>
            删除
          </a>
        </td>
        </tr>
        
        `;
          // 别忘了tr标签
        });

        // (2). 把数组转换为字符串 join
        // (3). 把生成的字符串追加给tbody

        //*******************************
        // const newArr = trArr.join("");
        // tbody.appendChild(newArr);
        // innerHTML 才是用来把字符串解析成 HTML 并渲染到页面的。
        // appendChild() 只能插入 DOM 元素，不能插入字符串！
        //*********************************

        tbody.innerHTML = trArr.join("");
        // 显示共计有几条数据
        document.querySelector(".title span").innerHTML = arr.length;
        // 2. 新增业务
      }
      render();
      // 函数要调用！！！！！！！！

      const info = document.querySelector(".info");
      const uname = document.querySelector(".uname");
      const age = document.querySelector(".name");
      const salary = document.querySelector(".salary");
      const gender = document.querySelector(".gender");
      const city = document.querySelector(".city");

      info.addEventListener("submit", function (e) {
        e.preventDefault();
        if (uname.value === "" || age.value === "" || salary.value === "") {
          // 可以直接看uname.value的值， 空为假，可以不要加判断
          return alert("不能为空");
        }
        // 不符合直接退出
        // 在if外编写程序
        arr.push({
          stuId: arr.length ? arr[arr.length - 1].stuId + 1 : 1,
          uname: uname.value,
          age: age.value,
          salary: salary.value,
          gender: gender.value,
          city: city.value,
          time: new Date().toLocaleString(),
          // 别忘括号，使用方法
        });

        this.reset();
        render();

        localStorage.setItem("data", JSON.stringify(arr));
      });
      // 2.1 form表单注册提交事件，阻止默认行为
      // 2.2 非空判断
      // 2.3 给 arr 数组追加对象，里面存储 表单获取过来的数据
      // 处理 stuId：数组最后一条数据的stuId + 1
      // 2.4 渲染页面和重置表单（reset()方法）
      // 2.5 把数组重新存入本地存储里面，记得转换为JSON字符串存储

      tbody.addEventListener("click", function (e) {
        if (e.target.tagName === "A") {
          if (confirm("是否删除数据")) {
            arr.splice(e.target.dataset.id, 1);
            render();
            localStorage.setItem("data", JSON.stringify(arr));
          }
        }
      });
      // 3. 删除业务
      // 3.1 采用事件委托形式，给 tbody 注册点击事件
      // 3.2 得到当前点击链接的索引号。渲染数据的时候，动态给a链接添加自定义属性例如 data-id="0"
      // 确认框 确认是否要真的删除
      // 3.3 根据索引号，利用 splice 删除数组这条数据
      // 3.4 重新渲染页面
      // 3.5 把最新 arr 数组存入本地存储
    </script>
  </body>
</html>
