  <body>
    <script>
      const obj = {
        name: "king",
        age: 9,
      };
      const objCopy = {};
      Object.assign(objCopy, obj);
      objCopy.age = 999;
      console.log(objCopy);

      const objCopy2 = { ...obj };
      objCopy2.age = 98978;
      console.log(objCopy2);
    </script>
  </body>
